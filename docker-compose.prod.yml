services:
  mongo:
    container_name: jobtrackr-mongo
    environment:
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASS=${MONGO_APP_PASS}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
    env_file: .env.prod
    volumes:
      - mongo_data:/data/db
      - ./api/src/config/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - jobtrackr_net

  mongo-express:
    env_file: .env.prod
    networks:
      - jobtrackr_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobtrackr-api
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jobtrackr_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jobtrackr-web
    restart: unless-stopped
    env_file: .env.prod
    environment:
      - PORT=3000
    depends_on:
      - api
    networks:
      - jobtrackr_net

  nginx:
    image: nginx:alpine
    container_name: jobtrackr-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - jobtrackr_net

  prometheus:
    image: prom/prometheus:latest
    container_name: jobtrackr-prometheus
    restart: unless-stopped
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - jobtrackr_net

  grafana:
    image: grafana/grafana:latest
    container_name: jobtrackr-grafana
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3000'    # localhost only — not exposed
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - jobtrackr_net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: jobtrackr-node-exporter
    restart: unless-stopped
    pid: host                          # ← ADD THIS — access host process info
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /run:/run:ro                   # ← ADD THIS
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'        # ← ADD THIS
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.pressure'         # ← ADD THIS — enables pressure metrics
    networks:
      - jobtrackr_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: jobtrackr-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - jobtrackr_net

networks:
  jobtrackr_net:
    driver: bridge

volumes:
  mongo_data:
    name: jobtrackr_mongo_data
    external: true
  prometheus_data:
    name: jobtrackr_prometheus_data
    external: true
  grafana_data:
    name: jobtrackr_grafana_data
    external: true
