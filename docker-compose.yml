services:
  mongo:
    image: mongo:7
    container_name: jobtrackr-mongo
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret_password
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express
    container_name: jobtrackr-mongo-admin
    restart: always
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret_password
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret_password@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: dev
      ME_CONFIG_BASICAUTH_PASSWORD: dev_password
    depends_on:
      - mongo

volumes:
  mongo_data:
