services:
  mongo:
    image: mongo:7
    container_name: jobtrackr-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_INIT_DATABASE=jobtrackr
      - MONGO_APP_USER=${MONGO_APP_USER}
      - MONGO_APP_PASS=${MONGO_APP_PASS}
    volumes:
      - mongo_data:/data/db
      - ./api/src/config/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - jobtrackr_net

  mongo-express:
    image: mongo-express
    container_name: jobtrackr-mongo-admin
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_ROOT_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_ROOT_PASS}
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_PASS}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jobtrackr_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobtrackr-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jobtrackr_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jobtrackr-web
    restart: unless-stopped
    environment:
      - PORT=3000
    depends_on:
      - api
    networks:
      - jobtrackr_net

  nginx:
    image: nginx:alpine
    container_name: jobtrackr-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - jobtrackr_net

networks:
  jobtrackr_net:
    driver: bridge

volumes:
  mongo_data:
    name: jobtrackr_mongo_data
