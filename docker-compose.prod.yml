services:
  mongo:
    container_name: jobtrackr-mongo
    env_file: .env.prod
    volumes:
      - mongo_data:/data/db
      - ./api/src/config/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - jobtrackr_net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: jobtrackr-api
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - jobtrackr_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: jobtrackr-web
    restart: unless-stopped
    env_file: web/.env.prod
    environment:
      - PORT=3000
    depends_on:
      - api
    networks:
      - jobtrackr_net

  nginx:
    image: nginx:alpine
    container_name: jobtrackr-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - jobtrackr_net

networks:
  jobtrackr_net:
    driver: bridge

volumes:
  mongo_data:
    name: jobtrackr_mongo_data
