# .github/workflows/deploy.yml
name: Deploy JobTrackr

on:
  push:
    branches: [main, staging]        # triggers on every push to main or staging

jobs:
  deploy:
    runs-on: self-hosted    # runs ON YOUR MACHINE (free)

    env:
      COMPOSE_PROJECT_NAME: job-tracker   # stable name prevents container/volume conflicts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.prod
        run: |
          echo "${{ secrets.ENV_PROD }}" > .env.prod

      - name: Cleanup previous stack (self-hosted safety)
        run: |
          # Force-remove named containers regardless of which Compose project created them
          docker rm -f jobtrackr-mongo jobtrackr-mongo-admin jobtrackr-api jobtrackr-web jobtrackr-nginx 2>/dev/null || true
          # Also clean up any orphan networks
          docker network rm job-tracker_jobtrackr_net jobsearch_jobtrackr_net 2>/dev/null || true

      - name: Rebuild and restart containers
        run: |
          docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml \
            up --build -d --remove-orphans

      - name: Verify deployment
        run: |
          echo "Waiting for services to become healthy..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost/api/v1/health; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "⏳ Attempt $i/24 failed, retrying in 5s..."
            sleep 5
          done
          echo "❌ Health check failed after 2 minutes"
          docker compose -p job-tracker logs --tail=50
          exit 1