name: JobTrackr Pro — Build & Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env.prod
        run: |
          cat > .env.prod << EOF
          MONGO_ROOT_USER=${{ secrets.MONGO_ROOT_USER }}
          MONGO_ROOT_PASS=${{ secrets.MONGO_ROOT_PASS }}
          MONGO_APP_USER=${{ secrets.MONGO_APP_USER }}
          MONGO_APP_PASS=${{ secrets.MONGO_APP_PASS }}
          MONGO_URI=${{ secrets.MONGO_URI }}
          NODE_ENV=production
          PORT=5000
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_EXPIRES_IN=15m
          JWT_REFRESH_EXPIRES_IN=7d
          GRAFANA_PASS=${{ secrets.GRAFANA_PASS }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          ME_USER=${{ secrets.ME_USER }}
          ME_PASS=${{ secrets.ME_PASS }}
          EOF

      - name: Create web/.env.prod
        run: |
          cat > web/.env.prod << EOF
          NODE_ENV=production
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          EOF

      - name: Force remove conflicting containers
        run: |
          docker stop jobtrackr-cadvisor jobtrackr-prometheus \
            jobtrackr-grafana jobtrackr-mongo jobtrackr-node-exporter \
            jobtrackr-api jobtrackr-web jobtrackr-nginx \
            jobtrackr-mongo-admin 2>/dev/null || true

          docker rm -f jobtrackr-cadvisor jobtrackr-prometheus \
            jobtrackr-grafana jobtrackr-mongo jobtrackr-node-exporter \
            jobtrackr-api jobtrackr-web jobtrackr-nginx \
            jobtrackr-mongo-admin 2>/dev/null || true

      - name: Stop existing containers
        run: |
          docker compose \
            --project-name jobtrackr \
            --env-file .env.prod \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            down --remove-orphans
        continue-on-error: true

      - name: Build and start containers
        run: |
          docker compose \
            --project-name jobtrackr \
            --env-file .env.prod \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up --build -d --remove-orphans

      - name: Show container status
        run: |
          sleep 5
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          echo "--- API Logs ---"
          docker logs jobtrackr-api --tail 20

      - name: Remove secrets from disk
        if: always()
        run: rm -f .env.prod web/.env.prod

      - name: Health check
        run: |
          echo "Waiting for API to be ready..."
          MAX_WAIT=90
          ELAPSED=0

          until curl -sf http://localhost/api/v1/health; do
            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "❌ Health check timed out after ${MAX_WAIT}s"
              echo "--- API Logs ---"
              docker logs jobtrackr-api --tail 30
              echo "--- Nginx Logs ---"
              docker logs jobtrackr-nginx --tail 20
              exit 1
            fi
            echo "⏳ Not ready yet... (${ELAPSED}s elapsed)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          echo "✅ Health check passed!"

      - name: Docker cleanup
        if: always()
        run: docker image prune -f